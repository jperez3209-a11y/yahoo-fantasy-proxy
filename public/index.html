<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diamond Edge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0f1a; color: #e2e8f0; font-family: -apple-system, sans-serif; font-size: 14px; }
    #app { max-width: 960px; margin: 0 auto; padding: 20px; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .header h1 { font-size: 20px; font-weight: 700; color: #f59e0b; letter-spacing: .05em; }
    .header .date { font-size: 12px; color: #475569; font-family: monospace; }
    #status { font-size: 11px; font-family: monospace; color: #475569; }

    /* Auth card */
    .card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 24px; margin-bottom: 16px; }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #f1f5f9; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
    .field input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 9px 11px; color: #e2e8f0; font-size: 13px; font-family: monospace; outline: none; }
    .field input:focus { border-color: #f59e0b; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-gold { background: #f59e0b; color: #000; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid #334155; color: #64748b; }
    .btn + .btn { margin-left: 8px; }
    .note { font-size: 11px; color: #475569; margin-top: 10px; line-height: 1.6; }

    /* Today bar */
    #today-bar { background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .game-chip { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 2px 7px; font-family: monospace; font-size: 11px; color: #94a3b8; }

    /* Section */
    .section { margin-bottom: 24px; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #475569; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1e293b; }

    /* Player row */
    .player-row { background: #111827; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    .player-row:hover { border-color: #334155; }
    .player-name { font-weight: 600; color: #f1f5f9; font-size: 14px; min-width: 160px; }
    .player-pos { font-family: monospace; font-size: 10px; color: #3b82f6; background: rgba(59,130,246,.1); border-radius: 3px; padding: 1px 5px; }
    .player-team { font-family: monospace; font-size: 11px; color: #475569; min-width: 35px; }
    .player-opp { font-size: 12px; color: #94a3b8; margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .hand-badge { font-family: monospace; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; }
    .hand-L { background: rgba(59,130,246,.15); color: #93c5fd; }
    .hand-R { background: rgba(245,158,11,.15); color: #fbbf24; }
    .no-game { font-size: 11px; color: #334155; font-family: monospace; }

    /* Pts */
    .player-pts { font-family: monospace; font-size: 12px; color: #64748b; min-width: 60px; text-align: right; }

    .hidden { display: none; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(245,158,11,.2); border-top-color: #f59e0b; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
    .fade { animation: fadeIn .25s ease; }
  </style>
</head>
<body>
<div id="app">

  <div class="header">
    <h1>⚾ DIAMOND EDGE</h1>
    <div>
      <span class="date" id="today-date"></span>
      <span id="status" style="margin-left:12px"></span>
    </div>
  </div>

  <!-- AUTH -->
  <div id="auth-section">
    <div class="card" id="creds-card">
      <h2>Connect Yahoo Fantasy</h2>
      <div class="field"><label>Client ID</label><input id="cid" type="text" placeholder="dj0y..." autocomplete="off" spellcheck="false"/></div>
      <div class="field"><label>Client Secret</label><input id="csec" type="password" placeholder="••••••••" autocomplete="off"/></div>
      <button class="btn btn-gold" id="creds-btn" onclick="saveCreds()" disabled>Continue →</button>
      <p class="note">🔒 Stays in your browser — only sent to Yahoo's OAuth servers.</p>
    </div>

    <div class="card hidden" id="oauth-card">
      <h2>Authorize Yahoo</h2>
      <div id="oauth-idle">
        <p style="font-size:13px;color:#94a3b8;margin-bottom:14px;line-height:1.7">Click below, log in to Yahoo, click Agree, then copy the <code style="font-family:monospace;background:#1e293b;padding:1px 4px;border-radius:3px">code=</code> value from the URL on the error page.</p>
        <button class="btn btn-blue" onclick="startAuth()">Open Yahoo Authorization</button>
        <button class="btn btn-ghost" onclick="skipAuth()" style="margin-top:8px;display:block;width:100%">Skip for now</button>
      </div>
      <div id="oauth-waiting" class="hidden">
        <div class="field"><label>Paste code= value from URL</label><input id="auth-code" type="text" placeholder="e.g. ntesqrk9..." autocomplete="off" spellcheck="false"/></div>
        <button class="btn btn-gold" id="exchange-btn" onclick="exchangeCode()" disabled>Connect →</button>
        <button class="btn btn-ghost" onclick="document.getElementById('oauth-idle').classList.remove('hidden');document.getElementById('oauth-waiting').classList.add('hidden')">← Back</button>
      </div>
      <div id="oauth-error" class="hidden" style="color:#fca5a5;font-size:12px;margin-top:10px"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div id="today-bar">
      <span style="color:#f59e0b;font-weight:600;font-size:11px;font-family:monospace">TODAY</span>
      <span id="games-list">Loading schedule...</span>
    </div>

    <div class="section fade" id="batters-section">
      <div class="section-title">Batters</div>
      <div id="batters-list"></div>
    </div>

    <div class="section fade" id="pitchers-section">
      <div class="section-title">Pitchers</div>
      <div id="pitchers-list"></div>
    </div>
  </div>

</div>
<script>
const API = 'https://yahoo-fantasy-proxy.vercel.app';
const SEASON = '2026';
const MLB_TO_YAHOO = {NYY:'NYY',BOS:'BOS',TBR:'TB',TOR:'TOR',BAL:'BAL',CLE:'CLE',DET:'DET',CHW:'CWS',KCR:'KC',MIN:'MIN',HOU:'HOU',LAA:'LAA',OAK:'OAK',SEA:'SEA',TEX:'TEX',ATL:'ATL',MIA:'MIA',NYM:'NYM',PHI:'PHI',WSH:'WAS',CHC:'CHC',CIN:'CIN',MIL:'MIL',PIT:'PIT',STL:'STL',ARI:'ARI',COL:'COL',LAD:'LAD',SDP:'SD',SFG:'SF'};

const ST = { clientId:'', clientSecret:'', token:null, leagueKey:null, teamKey:null, pkceVerifier:'', teamToPitcher:{} };

// Set today's date
document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

// Creds
document.getElementById('cid').addEventListener('input', checkCreds);
document.getElementById('csec').addEventListener('input', checkCreds);
function checkCreds(){ document.getElementById('creds-btn').disabled = !document.getElementById('cid').value.trim() || !document.getElementById('csec').value.trim(); }
function togglePw(){ const i = document.getElementById('csec'); i.type = i.type==='password'?'text':'password'; }

function saveCreds(){
  ST.clientId = document.getElementById('cid').value.trim();
  ST.clientSecret = document.getElementById('csec').value.trim();
  const saved = sessionStorage.getItem('de_token');
  if(saved){ ST.token = saved; enterDashboard(); return; }
  document.getElementById('creds-card').classList.add('hidden');
  document.getElementById('oauth-card').classList.remove('hidden');
}

// PKCE
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
async function genPKCE(){ const v=b64url(crypto.getRandomValues(new Uint8Array(32))); const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)); return{verifier:v,challenge:b64url(d)}; }

async function startAuth(){
  const pkce = await genPKCE(); ST.pkceVerifier = pkce.verifier;
  const p = new URLSearchParams({client_id:ST.clientId,redirect_uri:'https://localhost',response_type:'code',code_challenge:pkce.challenge,code_challenge_method:'S256'});
  window.open('https://api.login.yahoo.com/oauth2/request_auth?'+p,'_blank');
  document.getElementById('oauth-idle').classList.add('hidden');
  document.getElementById('oauth-waiting').classList.remove('hidden');
  document.getElementById('auth-code').addEventListener('input', e=>{ document.getElementById('exchange-btn').disabled=!e.target.value.trim(); });
}

async function exchangeCode(){
  let raw = document.getElementById('auth-code').value.trim();
  if(raw.includes('code=')){ const m=raw.match(/[?&]code=([^&]+)/); if(m) raw=m[1]; }
  setStatus('Connecting...');
  try{
    const res = await fetch(API+'/api/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:raw,code_verifier:ST.pkceVerifier,client_id:ST.clientId,client_secret:ST.clientSecret,redirect_uri:'https://localhost'})});
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'Token exchange failed');
    ST.token = data.access_token;
    sessionStorage.setItem('de_token', ST.token);
    enterDashboard();
  }catch(e){
    document.getElementById('oauth-error').textContent = '⚠️ '+e.message;
    document.getElementById('oauth-error').classList.remove('hidden');
  }
}

function skipAuth(){ enterDashboard(); }

async function enterDashboard(){
  document.getElementById('auth-section').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  setStatus('<span class="spinner"></span>Loading...');
  await loadSchedule();
  if(ST.token){
    await loadLeague();
    await loadRoster();
  } else {
    setStatus('No Yahoo connection');
    document.getElementById('batters-list').innerHTML = '<div style="color:#475569;font-size:13px;padding:12px">Reconnect Yahoo to see your roster.</div>';
  }
}

// Schedule
async function loadSchedule(){
  try{
    const today = new Date().toISOString().split('T')[0];
    const res = await fetch(API+'/api/schedule?date='+today);
    const data = await res.json();
    const games = data.games||[];
    document.getElementById('games-list').innerHTML = games.map(g=>`<span class="game-chip">${g.away.team} @ ${g.home.team}</span>`).join('');
    games.forEach(g=>{
      if(g.away.probablePitcher){ const t=MLB_TO_YAHOO[g.away.team]||g.away.team; ST.teamToPitcher[t]={name:g.away.probablePitcher.name,hand:g.away.probablePitcher.throws,opp:g.home.team}; }
      if(g.home.probablePitcher){ const t=MLB_TO_YAHOO[g.home.team]||g.home.team; ST.teamToPitcher[t]={name:g.home.probablePitcher.name,hand:g.home.probablePitcher.throws,opp:g.away.team}; }
    });
  }catch(e){ document.getElementById('games-list').textContent='Schedule unavailable'; }
}

// Yahoo
async function yFetch(ep){
  const res = await fetch(API+'/api/yahoo?endpoint='+encodeURIComponent(ep),{headers:{Authorization:'Bearer '+ST.token}});
  if(res.status===401) throw new Error('Token expired — refresh the page to reconnect');
  return res.json();
}

async function loadLeague(){
  const data = await yFetch('users;use_login=1/games;game_codes=mlb;seasons='+SEASON+'/leagues?');
  ST.leagueKey = data.fantasy_content.users[0].user[1].games[0].game[1].leagues[0].league[0].league_key;
}

async function loadRoster(){
  // Get my team
  const td = await yFetch('league/'+ST.leagueKey+'/teams?');
  const teams = td.fantasy_content.league[1].teams;
  for(let i=0;i<teams.count;i++){
    const t=teams[i].team[0];
    const mgrs=t.find(x=>x&&x.managers);
    if(mgrs&&mgrs.managers[0].manager.is_current_login){ ST.teamKey=t.find(x=>x&&x.team_key).team_key; break; }
  }
  if(!ST.teamKey) ST.teamKey=teams[0].team[0].find(x=>x&&x.team_key).team_key;

  // Get roster
  const rd = await yFetch('team/'+ST.teamKey+'/roster/players?');
  const players = rd.fantasy_content.team[1].roster[0].players;
  const batters=[], pitchers=[];

  for(let i=0;i<players.count;i++){
    const pArr=players[i].player[0];
    const get=key=>{const o=pArr.find(x=>x&&x[key]!==undefined);return o?o[key]:null;};
    const name=get('full_name')||(get('name')&&get('name').full)||'?';
    const team=(get('editorial_team_abbr')||'?').toUpperCase();
    const pos=get('display_position')||'?';
    const isPitcher=/SP|RP|\bP\b/.test(pos);
    const p={name,team,pos,isPitcher};
    if(isPitcher) pitchers.push(p); else batters.push(p);
  }

  renderPlayers('batters-list', batters);
  renderPlayers('pitchers-list', pitchers);
  setStatus('✓ Loaded · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
}

function renderPlayers(id, players){
  const el = document.getElementById(id);
  if(!players.length){ el.innerHTML='<div style="color:#475569;font-size:13px;padding:8px">None</div>'; return; }
  el.innerHTML = players.map(p=>{
    const matchup = ST.teamToPitcher[p.team];
    const oppHtml = matchup
      ? `<span style="color:#94a3b8;font-size:12px">${matchup.name}</span><span class="hand-badge hand-${matchup.hand||'?'}">${matchup.hand||'?'}</span>`
      : `<span class="no-game">No game today</span>`;
    return`<div class="player-row">
      <span class="player-name">${p.name}</span>
      <span class="player-pos">${p.pos}</span>
      <span class="player-team">${p.team}</span>
      <span class="player-opp">${oppHtml}</span>
    </div>`;
  }).join('');
}

function setStatus(html){ document.getElementById('status').innerHTML=html; }
</script>
</body>
</html>
